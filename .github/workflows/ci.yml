name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Ledger, the stack the scenario job runs, from baker-dev; the integration itself builds on
  # the Baker release CMakeLists.txt names.
  STACKS_COMMIT: 711db0097e3dc1737cf800985374629ff7203019

jobs:
  # The client, the publisher and their tests, without the network, in development and
  # shipping builds, on Linux, macOS and Windows. The shipping jobs also print the timings.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.build }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        build: [development, shipping]
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: macos, runner: macos-14 }
          - { os: windows, runner: windows-2022 }
          - { build: development, shipping: "OFF" }
          - { build: shipping, shipping: "ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsodium-dev
      - name: Dependencies (macOS)
        if: matrix.os == 'macos'
        run: brew install ninja libsodium pkgconf
      - name: Dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
      - name: MSVC environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBAKER_SHIPPING=${{ matrix.shipping }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Timings
        if: matrix.shipping == 'ON'
        shell: bash
        run: build/tests/liveops_bench 300

  # The scenario gate and retire through a stack: Ledger, built from baker-dev, runs its
  # scenarios headless.
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zach/baker-dev
          ref: ${{ env.STACKS_COMMIT }}
          path: baker-dev
      - name: Dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libsodium-dev
          libx11-dev libxext-dev libgl-dev libegl-dev
      - name: Build Ledger
        run: |
          cmake -S baker-dev/stacks -B build-stacks -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTACKS_BUILD_TESTS=OFF
          cmake --build build-stacks --target stacks_ledger
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        env:
          LIVEOPS_STACK_BIN: ${{ github.workspace }}/build-stacks/bin/stacks_ledger
          LIVEOPS_LEDGER: ${{ github.workspace }}/baker-dev/stacks/ledger
        run: python3 -I tests/test_cli.py build -v

  # The Nakama backend against Nakama (Apache-2.0) in a container: the one job with a
  # network service. The runtime's http_key is made for the run and masked.
  nakama:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsodium-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Start Nakama
        run: |
          key=$(openssl rand -hex 16)
          echo "::add-mask::$key"
          echo "NAKAMA_HTTP_KEY=$key" >> "$GITHUB_ENV"
          NAKAMA_HTTP_KEY=$key docker compose -f backends/nakama/docker-compose.yml up -d --wait
      - name: Test
        run: |
          nk="python3 -I $PWD/backends/nakama/liveops_nakama.py --url http://127.0.0.1:7350"
          LIVEOPS_NAKAMA_URL=http://127.0.0.1:7350 LIVEOPS_BACKEND="cmd:$nk" \
            LIVEOPS_CLIENT_BACKEND="cmd:$nk --client" python3 -I tests/test_cli.py build -v
      - name: Nakama's log
        if: failure()
        run: docker compose -f backends/nakama/docker-compose.yml logs nakama
      - name: Stop Nakama
        if: always()
        run: docker compose -f backends/nakama/docker-compose.yml down -v
