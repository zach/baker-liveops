# Nakama (Apache-2.0) with the liveops module, for the backend's tests:
#   NAKAMA_HTTP_KEY=$(openssl rand -hex 16) docker compose -f backends/nakama/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama
        exec /nakama/nakama --name liveops --database.address postgres:localdb@postgres:5432/nakama \
          --runtime.path /nakama/data/modules --runtime.http_key "$$NAKAMA_HTTP_KEY" \
          --logger.level WARN
    environment:
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    volumes:
      - ./modules:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7350:7350"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      retries: 60
